<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>link-in-bio</title>
  <style>
    @font-face {
      font-family: "Helvetica Neue";
      src: local("Helvetica Neue Bold"), local("HelveticaNeue-Bold");
      font-weight: 700;
    }
    @font-face {
      font-family: "Helvetica Neue";
      src: local("Helvetica Neue Medium"), local("HelveticaNeue-Medium");
      font-weight: 500;
    }
    @font-face {
      font-family: "Helvetica Neue";
      src: local("Helvetica Neue"), local("HelveticaNeue");
      font-weight: 400;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #00B140;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      width: 1920px;
      height: 1080px;
      display: grid;
      place-items: center;
    }
    .scene {
      display: flex;
      align-items: center;
      gap: 36px;
      transform-origin: 50% 50%;
    }

    /* Instagram profile card */
    .ig {
      width: 640px;
      background: #fff;
      border-radius: 36px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.28);
      padding: 32px 36px 34px;
      opacity: 0;
      transform: translateY(24px) scale(0.96);
      will-change: transform, opacity;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .handle {
      font-size: 30px;
      font-weight: 700;
      color: #0F0F0F;
      letter-spacing: -0.03em;
    }
    .chev {
      width: 12px;
      height: 12px;
      border-right: 3px solid #0F0F0F;
      border-bottom: 3px solid #0F0F0F;
      transform: rotate(45deg) translateY(-2px);
      border-radius: 1px;
    }
    .bar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .icon-bell {
      position: relative;
      width: 22px;
      height: 24px;
    }
    .icon-bell::before {
      content: "";
      position: absolute;
      inset: 0 2px 5px 2px;
      border: 2.5px solid #0F0F0F;
      border-radius: 10px 10px 4px 4px;
    }
    .icon-bell::after {
      content: "";
      position: absolute;
      left: 5px;
      bottom: 0;
      width: 8px;
      height: 4px;
      border: 2.5px solid #0F0F0F;
      border-top: none;
      border-radius: 0 0 6px 6px;
    }
    .icon-menu {
      width: 24px;
      height: 18px;
      border-top: 2.5px solid #0F0F0F;
      border-bottom: 2.5px solid #0F0F0F;
      position: relative;
    }
    .icon-menu::after {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      width: 24px;
      border-top: 2.5px solid #0F0F0F;
    }
    .row {
      display: flex;
      align-items: center;
    }
    .avatar {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #E9E4DC;
      box-shadow: 0 0 0 2px #F2EEE8;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 35%;
      display: block;
    }
    .stats {
      flex: 1;
      display: flex;
      justify-content: space-around;
      padding-left: 12px;
    }
    .stat { text-align: center; min-width: 96px; }
    .num {
      font-size: 28px;
      font-weight: 700;
      color: #0F0F0F;
      letter-spacing: -0.04em;
      line-height: 1.05;
      display: block;
    }
    .lbl {
      margin-top: 2px;
      font-size: 16px;
      font-weight: 400;
      color: #0F0F0F;
      display: block;
    }
    .name {
      margin-top: 22px;
      font-size: 20px;
      font-weight: 700;
      color: #0F0F0F;
      letter-spacing: -0.02em;
    }
    .bio {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 400;
      color: #0F0F0F;
      line-height: 1.35;
    }
    .link-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      position: relative;
      padding: 4px 6px 4px 2px;
      border-radius: 8px;
      transform-origin: 0% 50%;
    }
    .link-row svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #00376B;
    }
    .link-url {
      font-size: 18px;
      font-weight: 700;
      color: #00376B;
      letter-spacing: -0.01em;
    }
    .ripple {
      position: absolute;
      inset: -10px -14px;
      border-radius: 14px;
      border: 3px solid #3B82F6;
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }
    .tap {
      position: absolute;
      left: 55%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.18);
      border: 2px solid #3B82F6;
      opacity: 0;
      transform: scale(0.5);
      pointer-events: none;
    }
    .tap::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border-radius: 50%;
      background: #3B82F6;
    }
    .ig-tag {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #8C8478;
      letter-spacing: -0.01em;
      opacity: 0;
    }
    .ig-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E1306C;
    }

    /* Stan store reveal card */
    .stan {
      width: 420px;
      background: #fff;
      border-radius: 36px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.28);
      padding: 36px 32px 32px;
      opacity: 0;
      transform: translateX(28px) scale(0.94);
      will-change: transform, opacity;
    }
    .stan-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .stan-logo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      overflow: hidden;
      background: #6366f1;
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.35);
    }
    .stan-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .stan-word {
      margin-top: 16px;
      font-size: 28px;
      font-weight: 700;
      color: #0F0F0F;
      letter-spacing: -0.03em;
    }
    .stan-sub {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 500;
      color: #71717a;
      line-height: 1.4;
      max-width: 280px;
    }
    .stan-btns {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stan-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-radius: 12px;
      background: #0F0F0F;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: translateY(10px);
    }
    .stan-btn.ghost {
      background: #f4f4f5;
      color: #0F0F0F;
    }
    .arrow {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 12px 32px rgba(0,0,0,0.18);
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.6);
      flex-shrink: 0;
    }
    .arrow svg {
      width: 26px;
      height: 26px;
      color: #0F0F0F;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="scene" id="scene">
      <div class="ig" id="ig">
        <div class="bar">
          <div class="handle">withkyndall</div>
          <div class="chev"></div>
          <div class="bar-right">
            <div class="icon-bell"></div>
            <div class="icon-menu"></div>
          </div>
        </div>
        <div class="row">
          <div class="avatar">
            <img src="assets/profile-pic.png" alt="" />
          </div>
          <div class="stats">
            <div class="stat">
              <span class="num">7</span>
              <span class="lbl">posts</span>
            </div>
            <div class="stat">
              <span class="num">630</span>
              <span class="lbl">followers</span>
            </div>
            <div class="stat">
              <span class="num">76</span>
              <span class="lbl">following</span>
            </div>
          </div>
        </div>
        <div class="name">kyndall</div>
        <div class="bio">building with ai</div>
        <div class="link-row" id="linkRow">
          <div class="ripple" id="ripple"></div>
          <div class="tap" id="tap"></div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span class="link-url">bykyndall.com/links</span>
        </div>
        <div class="ig-tag" id="igTag">
          <span class="ig-dot"></span>
          link in bio
        </div>
      </div>

      <div class="arrow" id="arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </div>

      <div class="stan" id="stan">
        <div class="stan-top">
          <div class="stan-logo">
            <img src="assets/stan-logo.png" alt="" />
          </div>
          <div class="stan-word">stan store</div>
          <div class="stan-sub">the link-in-bio page where you sell stuff</div>
        </div>
        <div class="stan-btns">
          <div class="stan-btn" data-i="0">book a session</div>
          <div class="stan-btn ghost" data-i="1">editing guide · $29</div>
          <div class="stan-btn ghost" data-i="2">free guides</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const DURATION = 5.6;
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    function clamp(t) { return Math.max(0, Math.min(1, t)); }

    window.__seek = function(t) {
      const ig = document.getElementById("ig");
      const linkRow = document.getElementById("linkRow");
      const ripple = document.getElementById("ripple");
      const tap = document.getElementById("tap");
      const igTag = document.getElementById("igTag");
      const arrow = document.getElementById("arrow");
      const stan = document.getElementById("stan");
      const scene = document.getElementById("scene");

      // 1. IG card in
      const pop = easeOut(clamp(t / 0.4));
      ig.style.opacity = pop;
      ig.style.transform = `translateY(${(1 - pop) * 24}px) scale(${0.96 + 0.04 * pop})`;

      const tagA = easeOut(clamp((t - 0.55) / 0.3));
      igTag.style.opacity = tagA;

      // 2. pulse the bio link
      const pulseOn = t >= 1.0 && t < 1.85;
      const pulse = pulseOn ? 1 + 0.04 * Math.sin(t * 14) : 1;
      linkRow.style.transform = `scale(${pulse})`;
      linkRow.style.background = t >= 1.0 && t < 2.2 ? "rgba(59,130,246,0.08)" : "transparent";

      // 3. tap
      const tapAt = 1.85;
      const tapDur = 0.34;
      const tapP = clamp((t - tapAt) / tapDur);
      if (tapP > 0 && tapP < 1) {
        const press = tapP < 0.45 ? easeOut(tapP / 0.45) : 1 - easeOut((tapP - 0.45) / 0.55);
        tap.style.opacity = 0.9 * press;
        tap.style.transform = `scale(${0.5 + 0.5 * press})`;
        ripple.style.opacity = 0.75 * press;
        ripple.style.transform = `scale(${0.92 + 0.12 * press})`;
        linkRow.style.transform = `scale(${1 - 0.05 * press})`;
      } else if (t >= tapAt + tapDur) {
        tap.style.opacity = 0;
        ripple.style.opacity = 0;
      }

      // 4. scene shifts left a bit, arrow + stan card enter
      const reveal = easeOut(clamp((t - 2.25) / 0.45));
      scene.style.transform = `translateX(${-40 * reveal}px)`;

      const arrowA = Math.min(easeOutBack(clamp((t - 2.35) / 0.4)), 1.08);
      arrow.style.opacity = clamp((t - 2.35) / 0.25);
      arrow.style.transform = `scale(${0.6 + 0.4 * Math.min(arrowA, 1)})`;

      const stanA = easeOut(clamp((t - 2.55) / 0.42));
      stan.style.opacity = stanA;
      stan.style.transform = `translateX(${(1 - stanA) * 28}px) scale(${0.94 + 0.06 * stanA})`;

      document.querySelectorAll(".stan-btn").forEach((el) => {
        const i = parseInt(el.dataset.i, 10);
        const a = easeOut(clamp((t - (3.05 + i * 0.18)) / 0.32));
        el.style.opacity = a;
        el.style.transform = `translateY(${(1 - a) * 10}px)`;
      });
    };
    window.__duration = DURATION;
    window.__seek(0);
  </script>
</body>
</html>
