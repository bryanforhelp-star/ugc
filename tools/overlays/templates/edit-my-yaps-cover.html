<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>edit-my-yaps-cover</title>
  <style>
    @font-face {
      font-family: "Bootzy TM";
      src: url("../fonts/Bootzy-TM.woff2") format("woff2");
      font-weight: 400;
    }
    @font-face {
      font-family: "NewPixel";
      src: url("../fonts/NewPixel.woff2") format("woff2");
      font-weight: 400;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body {
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: #eceae4;
      color: #0b0b0c;
    }
    .cover {
      width: 1600px;
      height: 1000px;
      padding: 72px 80px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: "NewPixel", Georgia, serif;
      font-size: 22px;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      color: #767672;
    }
    .top .price {
      color: #1b2bff;
      letter-spacing: 0.08em;
    }
    .title {
      font-family: "Bootzy TM", system-ui, sans-serif;
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.03em;
      font-size: 168px;
    }
    .title span {
      display: block;
    }
    .yaps {
      display: inline-block;
      background: #1b2bff;
      color: #fff;
      padding: 4px 28px 18px 22px;
      margin-top: 10px;
    }
    .timeline {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      height: 88px;
      margin-top: 28px;
    }
    .clip {
      flex: 1;
      border-radius: 6px 6px 2px 2px;
      background: #0b0b0c;
    }
    .clip:nth-child(1) { height: 42%; background: #1b2bff; }
    .clip:nth-child(2) { height: 78%; }
    .clip:nth-child(3) { height: 28%; background: #1b2bff; opacity: 0.55; }
    .clip:nth-child(4) { height: 100%; }
    .clip:nth-child(5) { height: 54%; }
    .clip:nth-child(6) { height: 36%; background: #1b2bff; }
    .clip:nth-child(7) { height: 70%; }
    .clip:nth-child(8) { height: 22%; opacity: 0.28; }
    .clip:nth-child(9) { height: 88%; background: #1b2bff; }
    .clip:nth-child(10) { height: 46%; }
    .clip:nth-child(11) { height: 62%; }
    .clip:nth-child(12) { height: 18%; opacity: 0.28; }
    .bottom {
      font-family: "NewPixel", Georgia, serif;
      font-size: 20px;
      letter-spacing: 0.08em;
      color: #767672;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="top">
      <span>mini guide</span>
      <span class="price">$29</span>
    </div>
    <div>
      <div class="title">
        <span>how i</span>
        <span>edit my</span>
        <span class="yaps">yaps</span>
      </div>
      <div class="timeline" aria-hidden="true">
        <div class="clip"></div><div class="clip"></div><div class="clip"></div>
        <div class="clip"></div><div class="clip"></div><div class="clip"></div>
        <div class="clip"></div><div class="clip"></div><div class="clip"></div>
        <div class="clip"></div><div class="clip"></div><div class="clip"></div>
      </div>
    </div>
    <div class="bottom">the cuts. the captions. the little bits.</div>
  </div>
</body>
</html>
